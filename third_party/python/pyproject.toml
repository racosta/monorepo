[tool.pydoclint]
style = "google"

[tool.pyright]
include = ["projects"]
exclude = [
  "bazel-bin",
  "bazel-monorepo",
  "bazel-out",
  "bazel-testlogs",
  "external",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S"]

[tool.ty.src]
include = ["."]
