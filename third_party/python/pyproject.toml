[tool.flake8]
exclude = [
  "bazel-bin",
  "bazel-monorepo",
  "bazel-out",
  "bazel-testlogs",
  "external",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
max-line-length = 120

[tool.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"

[tool.pylint.format]
max-line-length = 120

[tool.pyright]
include = ["projects"]
exclude = [
  "bazel-bin",
  "bazel-monorepo",
  "bazel-out",
  "bazel-testlogs",
  "external",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S"]
