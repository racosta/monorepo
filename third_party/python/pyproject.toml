[tool.bandit.assert_used]
skips = ["**/*_test.py", "**/test_*.py"]

[tool.pydoclint]
style = "google"

[tool.pyright]
exclude = [
  "bazel-bin",
  "bazel-monorepo",
  "bazel-out",
  "bazel-testlogs",
  "external",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
include = ["projects"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
# extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S"]

[tool.ty.src]
include = ["."]
